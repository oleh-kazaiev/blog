services:
  # Development container with hot-reload
  devcontainer:
    build:
      context: .
      dockerfile: dev/backend.Dockerfile
    container_name: blog-dev
    volumes:
      - ./:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    env_file:
      - dev/.env
    depends_on:
      - db
      - redis
      - rabbitmq
      - kafka
      - localstack
      - stripelocal
      - elasticsearch
    ports:
      - "8000:8000"
      - "3000:3000"
      - "5678:5678"
      - "9229:9229"

  # PostgreSQL Database
  db:
    image: postgres:17.6-alpine
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    env_file:
      - dev/.env
    restart: unless-stopped

  # Redis
  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:4.2.0-alpine
    restart: unless-stopped
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  # Apache Kafka with KRaft (no ZooKeeper)
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    env_file:
      - dev/.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # LocalStack for S3
  localstack:
    image: localstack/localstack:4.7.0
    env_file:
      - dev/.env
    environment:
      - SERVICES=${LOCALSTACK_SERVICES}
      - DEBUG=${LOCALSTACK_DEBUG}
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/localstack:/var/lib/localstack
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh

  # LocalStripe
  stripelocal:
    image: tenzer/localstripe:1.15.7
    env_file:
      - dev/.env
    ports:
      - "8420:8420"

  # Payment microservice
  payment:
    build:
      context: .
      dockerfile: dev/payment.Dockerfile
    container_name: blog-payment-dev
    volumes:
      - ./microservices/payment:/workspace/microservices/payment
    working_dir: /workspace/microservices/payment
    command: uvicorn payment.app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - kafka
      - stripelocal
    env_file:
      - dev/.env
    stdin_open: true
    tty: true

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    ports:
      - "9200:9200"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    restart: unless-stopped

networks:
  default:
    name: blog_dev_default

volumes:
  kafka-data:
