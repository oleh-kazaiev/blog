services:
  # PostgreSQL Database with automatic backups
  db:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    volumes:
      - ./data/postgres_blog:/var/lib/postgresql/data
      - ./data/backups:/backups
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis for caching and Celery result backend
  redis:
    image: redis:8.2.1-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  # RabbitMQ for Celery task queue
  rabbitmq:
    image: rabbitmq:4.2.0-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  # Apache Kafka with KRaft
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    env_file:
      - .env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server=kafka:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # Traefik Reverse Proxy (replaces Nginx)
  traefik:
    image: traefik:v3.6.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.frontend.address=:3081
      - --entrypoints.backend.address=:3082
      - --entrypoints.localstack.address=:3083
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "3081:3081"
      - "3082:3082"
      - "3083:3083"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Django Backend (REST API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./stripelocal/init_stripe.py:/tmp/init_stripe.py
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
      stripelocal:
        condition: service_started
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${BACKEND_DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.services.backend.loadbalancer.server.scheme=http"
      - "traefik.http.middlewares.backend-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.backend.middlewares=backend-headers"
    restart: unless-stopped

  # Celery Worker (Default Queue)
  celery_default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A main.celery worker -l info -Q default -c ${CELERY_CONCURRENCY}
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    depends_on:
      - backend
      - redis
      - rabbitmq
      - kafka
    env_file:
      - .env
    restart: unless-stopped

  payment_events:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m kafkabus.consumer
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - kafka
    env_file:
      - .env
    restart: unless-stopped

  # Celery Worker (High Priority Queue)
  celery_high:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A main.celery worker -l info -Q high -c ${CELERY_HIGH_CONCURRENCY}
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    depends_on:
      - backend
      - redis
      - rabbitmq
      - kafka
    env_file:
      - .env
    restart: unless-stopped

  # React Frontend (builds and serves via own nginx)
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE: ${FRONTEND_API_BASE}
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=frontend"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    restart: unless-stopped

  # Elasticsearch for full-text search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
      - bootstrap.memory_lock=true
      - thread_pool.write.queue_size=200
      - thread_pool.search.queue_size=500
      - xpack.ml.enabled=false
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # LocalStack for S3 emulation
  localstack:
    image: localstack/localstack:4.7.0
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/localstack:/var/lib/localstack
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.localstack.rule=Host(`${S3_DOMAIN}`)"
      - "traefik.http.routers.localstack.entrypoints=localstack"
      - "traefik.http.services.localstack.loadbalancer.server.port=4566"
    restart: unless-stopped

  # LocalStripe for Stripe API emulation
  stripelocal:
    image: tenzer/localstripe:1.15.7
    env_file:
      - .env
    restart: unless-stopped

  # Payment Microservice (internal service - communicates via Kafka only)
  payment:
    build:
      context: ./microservices/payment
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    depends_on:
      - kafka
      - stripelocal
    env_file:
      - .env
    restart: unless-stopped

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A main.celery beat -l info
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - celery-beat-data:/var/lib/celery
    depends_on:
      - backend
      - redis
      - db
    env_file:
      - .env
    restart: unless-stopped

volumes:
  kafka-data:
  elasticsearch-data:
  celery-beat-data:
