[tool.poetry]
    name = "payment"
    version = "0.1.0"
    description = "Async payment processor service (FastAPI + Kafka)"
    authors = ["Your Name <you@example.com>"]
    package-mode = false

[tool.poetry.dependencies]
    python = "^3.13"
    fastapi = "0.115.4"
    uvicorn = {version = "0.35.0", extras=["standard"]}
    stripe = "9.6.0"
    kafka-python = "2.2.15"
    six = "1.17.0"

[tool.poetry.group.dev.dependencies]
    flake8 = "6.1.0"
    isort = "6.0.1"
    mypy = "1.17.0"

[build-system]
    requires = ["poetry-core>=1.0.0"]
    build-backend = "poetry.core.masonry.api"

[tool.flake8]
    max-line-length = 120
    extend-ignore = ["E203", "W503"]
    per-file-ignores = {"__init__.py" = ["F401"]}

[tool.isort]
    multi_line_output = 3
    line_length = 120
    profile = "black"

[tool.mypy]
    python_version = "3.13"
    ignore_missing_imports = true
    warn_unused_ignores = true
    check_untyped_defs = true
