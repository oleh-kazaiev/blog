[tool.poetry]
    name = "blog-backend"
    version = "0.1.0"
    description = "Django blog backend"
    authors = ["Oleh Kazaiev <olehkazaiev@gmail.com>"]
    package-mode = false

[tool.poetry.dependencies]
    python = "^3.13"
    Django = "5.2.5"
    djangorestframework = "3.16.1"
    psycopg = {version = "3.2.9", extras = ["binary"]}
    celery = "5.5.3"
    django-cors-headers = "4.7.0"
    redis = "6.4.0"
    django-ckeditor-5 = "0.2.18"
    Pillow = "11.3.0"
    uvicorn = "0.35.0"
    django-redis = "6.0.0"
    django-ratelimit = "4.1.0"
    boto3 = "1.40.22"
    django-storages = "1.14.6"
    stripe = "9.6.0"
    elasticsearch = "8.19.2"
    django-elasticsearch-dsl = "8.0"
    django-elasticsearch-dsl-drf = "0.22.5"
    kafka-python = "2.2.15"
    six = "1.17.0"

[tool.poetry.group.dev.dependencies]
    # Testing
    pytest = "8.4.1"
    pytest-socket = "0.7.0"
    pytest-xdist = "3.7.0"

    # Formatting / imports
    isort = "6.0.1"

    # Core linter (kept at 6.x because flake8-django (<7) constraint)
    flake8 = "6.1.0"

    # Flake8 plugins (exact pins for deterministic CI)
    flake8-docstrings = "1.7.0"
    flake8-import-order = "0.19.2"
    flake8-bugbear = "24.12.12"
    flake8-comprehensions = "3.16.0"
    flake8-simplify = "0.22.0"
    flake8-builtins = "3.0.0"
    flake8-implicit-str-concat = "0.5.0"
    flake8-logging-format = "2024.24.12"
    flake8-raise = "0.0.5"
    flake8-return = "1.2.0"
    flake8-django = "1.4"
    flake8-quotes = "3.4.0"
    flake8-bandit = "4.1.1"
    flake8-expression-complexity = "0.0.11"
    flake8-eradicate = "1.5.0"
    pep8-naming = "0.15.1"
    flake8-debugger = "4.1.2"
    flake8-pyproject = "1.2.3"

    # Type checking
    mypy = "1.17.0"

[build-system]
    requires = ["poetry-core>=1.0.0"]
    build-backend = "poetry.core.masonry.api"

[tool.isort]
    multi_line_output = 3
    line_length = 120
    known_django = "django"
    known_first_party = ["backend", "api", "users", "blog", "payments", "kafka", "main"]
    sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
    skip = ["migrations", ".venv"]

[tool.mypy]
    python_version = "3.13"
    ignore_missing_imports = true
    warn_unused_ignores = true
    check_untyped_defs = true
    exclude = [
        "migrations",
        "init_stripe.py",
    ]

[tool.pytest.ini_options]
    testpaths = ["tests"]
    python_files = ["test_*.py"]
    python_classes = ["Test*"]
    python_functions = ["test_*"]
    addopts = [
        "-n", "auto",
        "-v",
        "--disable-socket",
        "--allow-hosts=localhost,127.0.0.1,::1,redis,rabbitmq,kafka,localstack,db,postgres,elasticsearch,host.docker.internal",
    ]
